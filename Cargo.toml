[package]
name = "stortop"
description = "Multi-tenant storefronts with exact cryptocurrency checkout and confirmed delivery"
repository = "https://github.com/payroof/stor"
homepage = "https://github.com/payroof/stor"
documentation = "https://github.com/payroof/stor/tree/main/docs"
keywords = ["crypto", "ecommerce", "storefront", "payments", "google-sheets"]
categories = ["web-programming::http-server", "command-line-utilities"]
readme = "README.md"
# The published crate holds only what it builds from, plus docs (no apps, CI, tests or Docker).
include = ["src/**", "migrations/**", "web/**", "docs/**", "config/stortop.example.toml", "README.md", "CHANGELOG.md", "LICENSE-*", "!**/.DS_Store"]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
[dependencies]
anyhow = "=1.0.104"
altcha = "=1.0.0"
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "=0.23.1"
chacha20poly1305 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
csv = "=1.4.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.13.0"
num-bigint = "=0.5.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "=1.1.8"
tower = { version = "=0.5.3", features = ["util", "limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
zeroize = { version = "=1.9.1", features = ["derive", "serde"] }
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
