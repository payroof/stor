# The values below are the defaults.
[limits]
json_body = 32768                # bytes of a JSON request body
webhook_body = 16384             # bytes of a webhook body
request_timeout_seconds = 30     # reading the request and answering it
concurrency = 64                 # requests handled at once
customers_per_store = 10000      # customer cookies one store issues
ordinary_per_minute = 120        # requests per minute per client
proof_per_minute = 10            # challenge requests per minute per client
create_per_minute = 3            # store creations and checkouts per minute per client
stores_per_day = 10              # stores one client creates per day
rate_limit_entries = 100000      # rate-limit records kept
